plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    // Kotlin for Forge is the runtime that loads Kotlin on NeoForge. Hex Casting's
    // neoforge.mods.toml declares it; keep it on the dev runtime as well.
    // Modrinth maven version id for kotlinforforge-5.13.0-all.jar (NeoForge 1.21.1).
    runtimeOnly 'maven.modrinth:kotlin-for-forge:9ZlVvei8'

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'fabric.mod.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

def ciArtifacts = tasks.register('ciArtifacts', Copy) {
    from remapJar
    into rootProject.file('build/ciArtifacts')
}
tasks.named('build') { dependsOn ciArtifacts }
