name: Release

on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: Publish to GitHub
        type: boolean
        default: true
      publish_curseforge:
        description: Publish to CurseForge
        type: boolean
        default: true
      publish_modrinth:
        description: Publish to Modrinth
        type: boolean
        default: true
      publish_hexdoc:
        description: Publish hexdoc book
        type: boolean
        default: true
      dry_run:
        description: Perform a dry run
        type: boolean
        default: false

env:
  PYPI_PACKAGE: hexdoc-abadoned_greatwork

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      pages: read
    with:
      mod_release: ${{ inputs.publish_curseforge || inputs.publish_modrinth || inputs.publish_github }}
      hexdoc_release: ${{ inputs.publish_hexdoc }}
      dry_run: ${{ inputs.dry_run }}
      skip_tests: true

  publish-mod:
    needs: build
    if: inputs.publish_curseforge || inputs.publish_modrinth || inputs.publish_github
    runs-on: ubuntu-latest
    environment:
      name: curseforge-modrinth
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        env:
          RELEASE: true
        run: ./gradlew build

      # The 1.21 branch builds with Architectury Loom directly and does not apply
      # me.modmuss50.mod-publish-plugin, so CurseForge/Modrinth/GitHub release
      # publishing is not a Gradle task here. Upload the remapped jars instead.
      - name: Upload release jars
        if: inputs.publish_curseforge || inputs.publish_modrinth || inputs.publish_github || inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: build/ciArtifacts/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: inputs.publish_hexdoc && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PYPI_PACKAGE }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hexdoc-build
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
