# 自动发布 hexdoc 包到 PyPI
# 触发：推送 v* tag（如 v0.0.1.1.20.1.1.0）或手动 workflow_dispatch
# 认证：PyPI Trusted Publishing（OIDC）——在 pypi.org 项目设置里添加 trusted publisher：
#   owner=xm1221, repository=<本仓库>, workflow=publish.yml
# 无需任何 API token / secret。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing 需要

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hexdoc-abadoned-greatwork
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          # 只用 wheel（hatch-gradle-version 的 sdist→wheel 重建有已知冲突，
          # 且 wheel-only 足够 PyPI 分发）
          python -m build --wheel

      - name: Check built version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL="$(ls dist/*.whl)"
          VER="$(basename "$WHEEL" | sed -E 's/^[^-]+-([^-]+)-py3.*/\1/')"
          echo "tag=$TAG wheel_version=$VER wheel=$WHEEL"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag version ($TAG) != built wheel version ($VER)"
            exit 1
          fi

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
