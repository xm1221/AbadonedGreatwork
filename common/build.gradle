architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Fabric Loader is only here for the @Environment annotations, which Architectury
    // remaps per platform. Do not use other classes from it.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$rootProject.kotlinVersion"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDir file('src/generated/resources')
        }
    }
}
