modid = "abadoned_greatwork"
book = "hexcasting:thehexbook"

resource_dirs = [  # top takes priority
    "resources",
    "{$_common.src}/main/resources",
    { path="{$_common.src}/generated/resources", required=false },
    "{$_fabric.src}/main/resources",
    { path="{$_fabric.src}/generated/resources", required=false },
    "{$_forge.src}/main/resources",
    { path="{$_forge.src}/generated/resources", required=false },
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_abadoned_greatwork/_export/generated"

[template]
icon = "{$_common.src}/main/resources/assets/abadoned_greatwork/icon.png"
include = [
    "abadoned_greatwork",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "Abadoned Greatwork"
author = "xm1221"
show_landing_text = false

[extra.hexcasting]
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
_pattern_regex = { "!Raw"='make\("(?P<name>[^"]+)",\s*HexDir\.(?P<startdir>\w+),\s*"(?P<signature>[qweasd]+)"' }

[[extra.hexcasting.pattern_stubs]]
path = "{$_common.kotlin}/registry/Abadoned_greatworkActions.kt"
regex = "{^_pattern_regex}"

# platforms

[_common]
src = "../common/src"
java = "{src}/main/java/cn/xm1221/abadoned_greatwork"
kotlin = "{src}/main/kotlin/cn/xm1221/abadoned_greatwork"

[_fabric]
src = "../fabric/src"
java = "{src}/main/java/cn/xm1221/abadoned_greatwork/fabric"
kotlin = "{src}/main/kotlin/cn/xm1221/abadoned_greatwork/fabric"

[_forge]
src = "../forge/src"
java = "{src}/main/java/cn/xm1221/abadoned_greatwork/forge"
kotlin = "{src}/main/kotlin/cn/xm1221/abadoned_greatwork/forge"
