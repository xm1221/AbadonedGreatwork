# non-minecraft values
org.gradle.jvmargs=-Xmx4096M
jetbrainsAnnotationsVersion=23.0.0

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# This project builds with two JDKs: the Gradle launcher must be 21 (Loom 1.11's
# unpick 3.0 requires it) while the mod compiles against 17 (libs.versions.toml:
# java = 17, jdk = 21). CI installs both via actions/setup-java, which exports
# JAVA_HOME_17_X64 - but Gradle does NOT auto-detect toolchains from that variable,
# so without this line the build fails with
#   Cannot find a Java installation ... matching: {languageVersion=17, ...}
# Verified locally by hiding every standard JDK17 location: only with this property
# does the toolchain resolve.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

# mod info
mavenGroup=cn.xm1221.abadoned_greatwork
modId=abadoned_greatwork
modVersion=0.0.1


